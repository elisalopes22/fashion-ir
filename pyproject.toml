[project]
name = "fashion-ir"
version = "0.1.0"
description = "A text-based clothing retrieval / recommendation system"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "rank-bm25",
    "scikit-learn",
    "sentence-transformers",
    "faiss-cpu",
    "nltk",
    "streamlit",
    "pillow",
    "ollama",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_ir"]
